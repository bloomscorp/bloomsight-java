name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: client · Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The client promises Java 11+.
        java: ['11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -pl bloomsight-java verify

  starter:
    name: starter · Java ${{ matrix.java }} · Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        boot: ['3.5.16', '4.0.9', '4.1.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -pl bloomsight-spring-boot-starter -am verify -Dspring-boot.version=${{ matrix.boot }}

  package:
    name: what would be published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last one listed is the default; 11 is there to prove the jar runs on it.
          java-version: |
            11
            21
          cache: maven
      - run: scripts/verify-package.sh
        env:
          JAVA11_HOME: ${{ env.JAVA_HOME_11_X64 }}
